---
- name: Paquetes del sistema de Programación
  ansible.builtin.include_role:
    name: syspkgs
  vars:
    syspkgs_names: "{{ asig_programacion_syspkgs }}"

- name: Entorno Python de Programación
  ansible.builtin.include_role:
    name: python
    tasks_from: venv
  vars:
    python_venv_name: programacion
    python_venv_python: "{{ asig_programacion_python }}"
    python_venv_packages: "{{ asig_programacion_pypkgs }}"
    python_venv_jupyter_kernel: true
    python_venv_display_name: "Programación (Python {{ asig_programacion_python }})"

- name: Editor VS Code
  ansible.builtin.include_role:
    name: vscode
