---
- name: Paquetes del sistema de Métodos Numéricos
  ansible.builtin.include_role:
    name: syspkgs
  vars:
    syspkgs_names: "{{ asig_metodos_numericos_syspkgs }}"

- name: Entorno Python de Métodos Numéricos
  ansible.builtin.include_role:
    name: python
    tasks_from: venv
  vars:
    python_venv_name: metodos_numericos
    python_venv_packages: "{{ asig_metodos_numericos_pypkgs }}"
    python_venv_jupyter_kernel: true
    python_venv_display_name: "Métodos Numéricos (Python {{ python_default }})"
