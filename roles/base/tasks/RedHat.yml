---
- name: EPEL (Alma/Rocky/CentOS Stream)
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['distribution'] != 'RedHat'

- name: EPEL (RHEL)
  ansible.builtin.dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
    disable_gpg_check: true
  when: ansible_facts['distribution'] == 'RedHat'

- name: Ver si el repositorio CRB/CodeReady está activo
  ansible.builtin.command: dnf -q repolist --enabled
  register: base_repolist
  changed_when: false

- name: Activar CRB (necesario para muchos paquetes -devel y EPEL)
  ansible.builtin.command: /usr/bin/crb enable
  when: >-
    'crb' not in base_repolist.stdout and
    'codeready' not in base_repolist.stdout
  changed_when: true
