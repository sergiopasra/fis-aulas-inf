[defaults]
inventory = inventories/aulas/hosts.yml
roles_path = roles
interpreter_python = auto_silent
forks = 20
stdout_callback = default
result_format = yaml
retry_files_enabled = false
# Todo lo necesario es ansible.builtin; si se añaden colecciones, se vendorizan aquí
collections_path = ./collections

[privilege_escalation]
become = true

[ssh_connection]
pipelining = true
